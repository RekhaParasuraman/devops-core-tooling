
# Name displayed in the GitHub Actions tab
name: Python CI Pipeline

# Events that automatically trigger this workflow
on:
  # Run when code is pushed to the main branch
  push:
    branches:
      - main

  # Run when a Pull Request targets the main branch
  pull_request:
    branches:
      - main

# Define the jobs to execute
jobs:
  build:
    # GitHub provides an Ubuntu virtual machine to run this job
    runs-on: ubuntu-latest

    # Steps are executed sequentially
    steps:
      # Download the repository code to the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the required Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

          # Cache pip packages to speed up future workflow runs
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Install project dependencies
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Check Python code style using Flake8
      # Exclude the local virtual environment directory
      - name: Run flake8
        run: python -m flake8 --exclude=.venv .

      # Execute unit tests using Pytest
      - name: Run pytest
        run: python -m pytest
